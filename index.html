<style>
/* Layout: phone frame on black; screen area scrolls; discussion zone + ask bar + tab bar pinned at the bottom.
   Home is a stack of rounded module cards; each opens its own page. */
:root{
  --bg:#000; --card:#1f1f1f; --card2:#2b2b2b; --ink:#fff; --muted:#8c8c8c; --dim:#3d3d3d; --hi:#5865f2; --warn:#e8a25b;
  --sans:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:100%;max-width:420px;height:860px;max-height:calc(100vh - 80px);min-height:600px;background:var(--bg);
  border:1px solid var(--card2);border-radius:44px;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;overflow-y:auto;padding:22px 12px 14px;display:flex;flex-direction:column;gap:10px}
.note{color:var(--muted);font-size:13px;text-align:center;line-height:1.5;max-width:420px}
/* cards */
.card{background:var(--card);border-radius:36px;padding:24px;border:0;color:inherit;font:inherit;text-align:left;width:100%;display:block}
button.card{cursor:pointer}
button.card:active{transform:scale(.985)}
.big{font-size:60px;font-weight:500;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted);font-size:16px;margin-top:10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{background:var(--card2);border-radius:99px;padding:10px 16px;display:flex;gap:14px;font-size:17px}
.dots{display:grid;grid-template-columns:repeat(13,1fr);gap:14px 0;margin-top:24px;justify-items:center}
.dots span{font-size:12px;line-height:1}
.dots span.off{color:var(--dim)}
.label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;display:flex;justify-content:space-between}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:18px}
.mrow + .mrow{margin-top:10px}
.m{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{padding:20px;border-radius:30px}
.num{font-size:32px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.small{color:var(--muted);font-size:14px;margin-top:4px}
.bar{height:4px;background:var(--dim);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.gem{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa3ff,var(--hi) 45%,#111 80%);display:inline-block;vertical-align:-2px;margin-left:8px}
/* page header */
.top{display:flex;align-items:center;gap:12px;padding:0 6px}
.back{background:var(--card);border:0;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.eyebrow{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0 8px}
.title{font-size:38px;font-weight:500;letter-spacing:-.02em;padding:0 8px 6px}
/* rows */
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--card2);font-size:17px}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .s{color:var(--muted);font-size:13.5px;margin-top:3px}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:none;flex:none;cursor:pointer;padding:0}
.check.on{background:var(--ink);border-color:var(--ink)}
.done .t>div:first-child{color:var(--muted);text-decoration:line-through}
.late{color:var(--warn);font-size:12.5px;white-space:nowrap;border:1px solid currentColor;border-radius:99px;padding:2px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.chip{border:0;background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#000}
/* planning */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:none;color:var(--ink);padding:10px 0;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit}
.day small{font-size:12px;color:var(--muted)}
.day.on{background:var(--ink);color:#000}.day.on small{color:#000}
.slot{display:flex;gap:14px;padding:12px 0;align-items:flex-start}
.time{color:var(--muted);width:48px;font-variant-numeric:tabular-nums;font-size:15px;padding-top:2px}
.ev{flex:1;border-left:2px solid var(--ink);padding:1px 0 1px 12px}
.ev.free{border-left:2px dashed var(--dim);color:var(--muted)}
.cta{background:var(--card);border-radius:36px;padding:26px;text-align:center;font-size:18px;border:0;color:var(--ink);width:100%;cursor:pointer;font-family:inherit}
/* discussion zone */
.talk{padding:0 12px;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto}
.msg{border-radius:22px;padding:10px 14px;font-size:14.5px;line-height:1.4;max-width:88%}
.msg.me{align-self:flex-end;background:var(--card2)}
.msg.cl{align-self:flex-start;background:var(--card);color:var(--ink)}
.msg.cl b{font-weight:500;color:var(--muted);display:block;font-size:12px;margin-bottom:2px}
.ask{padding:8px 12px 16px;display:flex;gap:8px;align-items:center}
.homebtn{flex:none;padding:0;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#000;cursor:pointer;display:grid;place-items:center}

.homebtn.on{background:var(--ink);color:#000}
.homebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.ask form{flex:1;min-width:0;display:flex;gap:8px;background:var(--card);border-radius:99px;padding:5px}
.ask input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:9px 14px}
.ask input::placeholder{color:var(--muted)}
.ask form button{background:var(--ink);color:#000;border:0;border-radius:99px;padding:0 16px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px 12px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--ink)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){button.card:active{transform:none}}
/* planning + tasks pages: style of mockup 1 (dark) */
.v1{--v-ink:#ecefe9;--v-muted:#9aa196;--v-line:#2c302b;--v-accent:#86b892;--v-warn:#e0a26a;font-family:-apple-system,system-ui,sans-serif;color:var(--v-ink);padding:6px 10px 0;font-size:15px}
.v1 .eb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
.v1 h1{font-size:28px;font-weight:600;margin:4px 0 18px;letter-spacing:-.02em}
.v1 h2{font-size:13px;font-weight:500;color:var(--v-muted);margin:22px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.v1 .vslot{display:flex;gap:12px;padding:10px 0}
.v1 .vtime{font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:var(--v-muted);width:44px;font-variant-numeric:tabular-nums;padding-top:2px}
.v1 .vev{flex:1;border-left:2px solid var(--v-accent);padding:2px 0 2px 12px;line-height:1.35}
.v1 .vtime small{display:block;font-size:12px;opacity:.6;margin-top:2px}
.v1 .vev.free{border-left:2px dashed var(--v-line);color:var(--v-muted)}
.v1 .vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--v-line)}
.v1 .vrow:last-child{border-bottom:0}
.v1 .vrow .t{flex:1;min-width:0}
.v1 .vs{font-size:12.5px;color:var(--v-muted);margin-top:2px}
.v1 .vcheck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--v-muted);background:none;cursor:pointer;flex:none;padding:0}
.v1 .vcheck.on{background:var(--v-accent);border-color:var(--v-accent)}
.v1 .done .t>div:first-child{text-decoration:line-through;color:var(--v-muted)}
.v1 .vlate{font-size:12px;padding:2px 8px;border-radius:99px;color:var(--v-warn);border:1px solid currentColor;white-space:nowrap}
.v1 .days{margin-bottom:6px}
.v1 .day b{font-family:-apple-system,system-ui,sans-serif;font-weight:500}
.v1 .chips{padding:0;margin-bottom:6px}
.v1 .cta{margin-top:18px}
/* liquid glass chat bar: floats over the content */
.screen{padding-bottom:110px}
.ask{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:8px 14px 18px}
.talk{position:absolute;left:0;right:0;bottom:78px;z-index:4;padding:0 14px}
.ask form{position:relative;padding:6px;border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.45)}
.ask form::before{content:"";position:absolute;inset:1px 18% auto;height:45%;border-radius:99px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ask input{position:relative}
.ask input::placeholder{color:rgba(255,255,255,.6)}
.ask form button{position:relative;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.msg.me,.msg.cl{-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.35)}
.msg.me{background:rgba(255,255,255,.14)}
.msg.cl{background:rgba(40,40,40,.55)}
/* side menu */
.phone{position:relative}
.menubtn{position:absolute;top:18px;right:18px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.menubtn i{display:block;width:14px;height:1.5px;border-radius:1px;background:var(--dim)}
.menubtn i.mid{width:18px;height:2.5px;background:var(--ink)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:78%;max-width:320px;background:var(--card);z-index:9;border-radius:36px 0 0 36px;padding:28px 22px;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.menu-open .scrim{opacity:1;pointer-events:auto}
.menu-open .drawer{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer .dh b{font-size:24px;font-weight:500;letter-spacing:-.02em}
.drawer .x{background:var(--card2);border:0;color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.drawer .sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 4px}
.drawer .it{background:none;border:0;color:var(--ink);font:inherit;font-size:18px;text-align:left;padding:11px 0;cursor:pointer;display:flex;justify-content:space-between}
.drawer .it{color:var(--muted)}.drawer .it.on{color:var(--ink);font-weight:500}
.drawer .it span{color:var(--muted)}
.drawer .it{align-items:center;justify-content:flex-start;gap:16px;padding:13px 0}
.drawer .ic{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;color:inherit}
.drawer .it.on .ic{background:var(--ink);color:#000}
.drawer .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.drawer .ic .atom{width:24px;height:24px}
.menubtn i{transition:width .2s,height .2s,background-color .2s}
.drawer{width:72%}
.menubtn{transition:transform .5s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.menubtn.pressing{transform:scale(.88)}
/* note editor (Notion-like) */
.wsave{background:var(--ink);color:#000;border:0;border-radius:99px;padding:10px 18px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.nedit{position:relative;padding:14px 14px 0;font-family:-apple-system,system-ui,sans-serif}
.nq{width:30px;height:30px;fill:none;stroke:var(--muted);stroke-width:1.5;margin:8px 0 10px}
.ntitle{margin-top:10px;margin-bottom:14px;font-size:32px;font-weight:600;letter-spacing:-.02em;outline:none;line-height:1.2}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--dim)}
.nprops{display:flex;flex-direction:column;gap:2px;margin:16px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--card2)}
.nprop{display:flex;align-items:center;gap:12px;font-size:14px;min-height:30px}
.nprop span{width:76px;color:var(--muted)}
.nprop b{font-weight:400}
.nprop select{background:var(--card);color:var(--ink);border:0;border-radius:8px;padding:5px 8px;font:inherit;font-size:14px}
.nbody{min-height:260px;outline:none;font-size:17px;line-height:1.6}
.nbody h2{font-size:22px;font-weight:600;margin:14px 0 4px}
.nbody ul{margin:4px 0;padding-left:22px}
.nbody blockquote{margin:8px 0;padding-left:14px;border-left:3px solid var(--ink);color:var(--muted)}
.nbody hr{border:0;border-top:1px solid var(--card2);margin:14px 0}
.nbody .todo{display:flex;gap:10px;align-items:baseline}
.nbody .todo input{accent-color:#86b892;width:16px;height:16px}
.nslash{position:absolute;left:14px;z-index:6;width:220px;background:var(--card);border:1px solid var(--card2);border-radius:18px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.nsh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:6px 10px}
.nslash button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}
.nslash button:hover,.nslash button:focus-visible{background:var(--card2)}
.nslash i{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--card2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.menubtn .mq{display:none;width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6}

.wsave{margin-right:56px}
.hero{position:relative;cursor:pointer;margin:-22px -12px 0;width:auto;border-radius:0 0 40px 40px;padding:44px 26px 22px}
.hero h1{margin:4px 0 20px;font-size:30px}
/* habits */
.v1 .hrow.done .t>div:first-child{text-decoration:none;color:var(--v-ink)}
.hweek{display:flex;gap:3px}
.hweek span{width:16px;height:16px;border-radius:50%;font-family:-apple-system,system-ui,sans-serif;font-size:12px;display:grid;place-items:center;color:var(--muted);background:var(--card2)}
.hweek span.y{background:#86b892;color:#000}
.hweek span.td{outline:1px solid var(--muted);outline-offset:1px}
/* daily progress: proposals */
.dprog{margin:-6px 0 22px}
.dph{display:flex;justify-content:space-between;font-size:13px;color:var(--v-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.dph span:last-child{font-family:-apple-system,system-ui,sans-serif;color:var(--v-ink);letter-spacing:0}
.dbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:8px}
.dbar i{display:block;height:100%;background:#86b892;border-radius:3px;transition:width .4s ease}
.segh{display:flex;align-items:baseline;gap:12px;margin:-8px 0 10px}
.segh b{font-size:40px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.segh small{font-size:18px;color:var(--v-muted);font-weight:500}
.segh span{color:var(--v-muted);font-size:14px}
.seg{display:flex;gap:4px;margin-bottom:18px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--card2);transition:background .3s}
.seg i.y{background:#86b892}
.propsw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:420px;font-size:13px;color:var(--muted)}

<script>
// Apple Calendar through the /api/calendar function (iCloud CalDAV).
window.deckCal={busy:{},
  async call(body){for(let i=0;i<30&&!(window.deckSync&&deckSync.token);i++)await new Promise(r=>setTimeout(r,100));
    if(!window.deckSync)throw new Error("Deck n'a pas pu charger la connexion, rouvre l'app");
    const tk=await deckSync.token();if(!tk)throw new Error(deckSync.email?"Ta session a expiré : déconnecte-toi puis reconnecte-toi (Compte, plus haut)":"Connecte d'abord la synchronisation (Compte, plus haut)");
    const r=await fetch("api/calendar",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:"Erreur "+r.status}));if(!r.ok)throw new Error(j.error||"Erreur");return j},
  async connect(){if(this.ing)return;this.ing=1;setTimeout(()=>{this.ing=0},1500);const id=(S.apple.id||"").trim(),pw=(S.apple.pw||"").trim();if(!id||!pw){S.apple.msg="Remplis les deux champs";render();return}
    S.apple.msg="Connexion…";render();
    try{const j=await this.call({action:"connect",appleId:id,password:pw});S.apple.cals=j.calendars.map(c=>[c.name,c.color,true,c.href]);S.apple.on=true;S.apple.form=false;S.apple.pw="";S.apple.msg="";S.apple.ev={};persist();render();this.load(0)}
    catch(e){S.apple.msg=e.message;render()}},
  async addLink(){if(this.adding)return;const u=(S.apple.link||"").trim();if(!u)return;this.adding=1;S.apple.lmsg="Ajout…";render();
    try{const r=await fetch(`api/ics?url=${encodeURIComponent(u)}`);const x=await r.json();if(!r.ok)throw new Error(x.error||"Lien illisible");
      const COL=["#7a5cff","#86b892","#d9a46a","#b59ad6","#d98a8a","#7fc4c4"];S.apple.cals.push([x.name,x.color||COL[S.apple.cals.length%COL.length],true,null,u]);
      S.apple.link="";S.apple.lmsg="";S.apple.ev={};this.busy={};persist();render();this.load(0)}
    catch(e){S.apple.lmsg=e.message;render()}finally{this.adding=0}},
  async disconnect(){try{await this.call({action:"disconnect"})}catch(e){}S.apple={on:false,cals:S.apple.cals.filter(c=>c[4]),ev:{},msg:""};persist();render()},
  async load(wk){if(!(S.apple.on||S.apple.cals.some(c=>c[4]))||this.busy[wk])return;this.busy[wk]=1;
    try{const from=new Date(TD.getFullYear(),TD.getMonth(),TD.getDate()-TDOW+wk*7),to=new Date(from.getFullYear(),from.getMonth(),from.getDate()+7);
      const cals=S.apple.cals.map((c,i)=>({href:c[3],i})).filter(c=>c.href&&S.apple.cals[c.i][2]);
      const j={events:[]};
      if(S.apple.on&&cals.length)j.events=(await this.call({action:"events",cals,from:from.toISOString(),to:to.toISOString()})).events;
      // Public links go through /api/ics (no account needed).
      await Promise.all(S.apple.cals.map((c,i)=>[c,i]).filter(([c])=>c[4]&&c[2]).map(async([c,i])=>{const r=await fetch(`api/ics?url=${encodeURIComponent(c[4])}&from=${from.toISOString()}&to=${to.toISOString()}`);const x=await r.json();if(!r.ok)throw new Error(c[0]+" : "+x.error);if(x.color&&!c[5]&&c[1]!==x.color){c[1]=x.color;persist()}x.events.forEach(e=>j.events.push({...e,cal:i}))}));
      for(let d=0;d<7;d++)S.apple.ev[wk+":"+d]=[];
      j.events.forEach(e=>{const t=e.start.length===10?new Date(e.start+"T00:00:00"):new Date(e.start),d=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-from)/864e5);if(d<0||d>6)return;
        S.apple.ev[wk+":"+d].push([e.allDay?"Jour":String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"),e.title||"Sans titre",e.cal,e.dur])});
      S.apple.err="";const hm=new Date();S.apple.diag=`${j.events.length} événement${j.events.length>1?"s":""} reçu${j.events.length>1?"s":""} de ${cals.length} calendrier${cals.length>1?"s":""} · ${String(hm.getHours()).padStart(2,"0")}:${String(hm.getMinutes()).padStart(2,"0")}`;if(["home","plan","settings"].includes(S.view))keepRender()}catch(e){S.apple.err="Calendrier Apple : "+e.message;S.apple.diag="Erreur : "+e.message;if(["home","plan"].includes(S.view))keepRender()}finally{setTimeout(()=>{delete this.busy[wk]},60000)}}};

<script>
// Apple Health: the iPhone Shortcut posts to /api/health with a personal token; the app reads health_daily.
window.deckHealth={
  async connect(){const db=window.deckSync&&deckSync.db;if(!db||!deckSync.email){S.health.msg="Connecte d'abord la synchronisation (Compte, plus haut)";render();return}
    let {data,error}=await db.from("health_tokens").select("token").maybeSingle();
    if(!data&&!error)({data,error}=await db.from("health_tokens").insert({}).select("token").single());
    if(error){S.health.msg="Lance d'abord le script SQL Santé dans Supabase";render();return}
    S.health.on=true;S.health.token=data.token;S.health.msg="";persist();render();this.load()},
  async disconnect(){S.health.on=false;S.health.token=null;persist();render()},
  async load(){const db=window.deckSync&&deckSync.db;if(!db||!S.health.on||!deckSync.email)return;
    if(!S.health.token){const t=await db.from("health_tokens").select("token").maybeSingle();if(t.data)S.health.token=t.data.token}
    const {data}=await db.from("health_daily").select("*").order("day",{ascending:false}).limit(1);const h=data&&data[0];
    if(h){const sm=h.sleep_minutes,u=new Date(h.updated_at);
      Object.assign(S.health,{sleep:sm!=null?Math.min(100,Math.round(sm/480*100)):null,sleepH:sm!=null?Math.floor(sm/60)+" h "+String(sm%60).padStart(2,"0"):null,hrv:h.hrv,hr:h.resting_hr,steps:h.steps,
        rec:h.hrv!=null&&h.resting_hr!=null?Math.max(0,Math.min(100,Math.round(50+(h.hrv-50)*0.8-(h.resting_hr-55)*1.5+((sm??420)-420)/6))):null,
        sync:(h.day===new Date().toISOString().slice(0,10)?"":new Date(h.day).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" ")+String(u.getHours()).padStart(2,"0")+":"+String(u.getMinutes()).padStart(2,"0")})}
    if(["home","sport","settings"].includes(S.view))keepRender()}};
</script>

    return `<div class="srow ro"><span class="t"><span>Clé de données</span><span class="vs mono" style="user-select:all">${esc(k.v||k.msg||"…")}</span></span>${k.v?`<button data-dkcopy style="${lk}">${k.cp?"Copiée":"Copier"}</button>`:""}</div>`}
  if(deckSync.usedKey){k.v=deckSync.usedKey;return `<div class="srow ro"><span class="t"><span>Clé de données</span><span class="vs mono" style="user-select:all">${esc(k.v)}</span></span><button data-dkcopy style="${lk}">${k.cp?"Copiée":"Copier"}</button><button data-dkoff style="${lk}">Retirer</button></div>`}
  return `<div class="srow ro" style="flex-wrap:wrap;gap:10px"><span class="t"><span>Clé de données</span><span class="vs">${esc(k.msg||"Ou colle ta clé pour tout récupérer")}</span></span><div style="display:flex;gap:8px;width:100%"><input id="dkin" class="sinput" placeholder="XXXX-XXXX-…" autocapitalize="characters" style="flex:1;max-width:none"><button data-dkuse style="background:#fff;color:#000;border:0;border-radius:99px;padding:0 16px;font:inherit;font-size:15px;cursor:pointer">OK</button></div></div>`}
document.addEventListener("click",async e=>{const k=S.dkey=S.dkey||{};
  if(e.target.closest("[data-dkcopy]")){e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(k.v);k.cp=1;render()}
  if(e.target.closest("[data-dkoff]")){e.stopPropagation();deckSync.forgetKey()}
  if(e.target.closest("[data-dkuse]")){e.stopPropagation();const v=($("#dkin")||{}).value||"";if(!v.trim())return;k.msg="Import…";render();const r=await deckSync.useKey(v);k.msg=r==="ok"?"":r;render()}},true);
window.deckClaude={async load(create){const db=window.deckSync&&deckSync.db;S.claude=S.claude||{};
  if(!db||!deckSync.email){if(create){S.claude.msg="Connecte d'abord la synchronisation (plus haut)";render()}return}
  let {data,error}=await db.from("claude_tokens").select("token").maybeSingle();
  if(!data&&!error&&create)({data,error}=await db.from("claude_tokens").insert({}).select("token").single());
  if(error){if(create){S.claude.msg="Relance d'abord le script SQL dans Supabase";render()}return}
  if(data){S.claude.url=location.origin+"/api/mcp?k="+data.token;S.claude.msg="";if(S.view==="settings")keepRender()}}};
document.addEventListener("click",async e=>{if(e.target.closest("[data-spcopy]")){e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(deckSync.space);S.spCopied=true;render();return}
 if(e.target.closest("[data-spoff]")){e.stopPropagation();S.spIn=deckSync.space;deckSync.leaveSpace();return}
 if(e.target.closest("[data-spuse]")){e.stopPropagation();const v=(($("#spin")||{}).value||"").trim();S.spIn=v;S.spMsg="Connexion…";keepRender();const r=await deckSync.useSpace(v);S.spMsg=r==="ok"?"":r;keepRender()}},true);
document.addEventListener("click",e=>{if(e.target.closest("[data-cact]")){e.stopPropagation();deckClaude.load(true)}if(e.target.closest("[data-ccopy]")){e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(deckSync.claudeUrl||S.claude.url);S.claude=S.claude||{};S.claude.copied=true;render()}},true);
</script>

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})});
  let had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)location.reload();had=true})}
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&new Date().toDateString()!==TD.toDateString())location.reload()});
